name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

# 同分支只允许一个构建在跑，避免并行创建同名 tag / release 互相打架
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1) 只负责「构建 + 校验 + 归档产物」，完全不碰 Release ────────────────
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      vc: ${{ steps.version.outputs.vc }}
      vn: ${{ steps.version.outputs.vn }}
      msg: ${{ steps.version.outputs.msg }}
      apk_ok: ${{ steps.apk.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install platform / build-tools / NDK / CMake
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;30.0.16248370" "cmake;4.1.2"

      # 不指定 gradle-version：直接用仓库里的 Gradle Wrapper，
      # 版本只在 gradle/wrapper/gradle-wrapper.properties 一处维护
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APK
        run: |
          set -o pipefail
          # 同时落盘一份日志，失败时下面那步会把关键错误行贴出来
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # 失败时把真正报错的行写进 job summary，并以 annotation 形式发出去。
      # annotation 无需登录即可通过 REST API 读取（/check-runs/<id>/annotations），
      # 方便远程定位（AGP 的原生构建输出都带 "C/C++:" 前缀，GitHub 自己解析不出来）。
      - name: Dump build errors
        if: failure()
        run: |
          {
            echo '## 构建失败：关键错误行'
            echo '```text'
            grep -aE 'error:|e: |FAILURE:|What went wrong|Caused by:|> Task .* FAILED|fatal:|CMake Error' build.log 2>/dev/null | head -n 80 || true
            echo '```'
            echo '## 日志尾部'
            echo '```text'
            tail -n 60 build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

          i=0
          while IFS= read -r line; do
            if [ -z "$line" ]; then continue; fi
            msg=${line//'%'/'%25'}
            msg=${msg//$'\r'/}
            echo "::error title=ci::${msg}"
            i=$((i + 1))
            if [ "$i" -ge 10 ]; then break; fi
          done < <(grep -aE 'error:|e: |FAILURE:|What went wrong|Caused by:|> Task .* FAILED|CMake Error' build.log 2>/dev/null | head -n 10 || true)
          exit 0

      # 关键闸门：只有真的产出了合法 APK 才把 apk_ok 置为 true，
      # release 任务据此决定是否发布（构建失败 / 产物缺失一律不发布）
      - name: Verify APK
        id: apk
        run: |
          set -e
          APK_PATH=$(ls -1 app/build/outputs/apk/release/*.apk 2>/dev/null | head -n1 || true)
          if [ -z "$APK_PATH" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::构建产物中找不到 *.apk，已中止，不会创建 Release"
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::$APK_PATH 为空文件，已中止，不会创建 Release"
            exit 1
          fi
          # 必须是合法 zip，避免把半截文件 / 错误页面当成 APK 发出去
          unzip -l "$APK_PATH" >/dev/null
          ls -la "$APK_PATH"
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Read version
        id: version
        run: |
          VC=$(git rev-list --count HEAD)
          VN="git+$(git rev-parse --short=8 HEAD)"
          TAG="${VC}-${VN}"
          MSG=$(git log -1 --pretty=%B)
          {
            echo "vc=$VC"
            echo "vn=$VN"
            echo "tag=$TAG"
            echo "msg<<EOF"
            echo "$MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Version: code=$VC name=$VN tag=$TAG"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  # ── 2) 只有 build 成功且 apk_ok=true 时才会执行 ──────────────────────────
  release:
    needs: build
    if: ${{ needs.build.outputs.apk_ok == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: app-release
          path: dist

      - name: Verify downloaded APK
        run: |
          set -e
          APK=$(ls -1 dist/*.apk 2>/dev/null | head -n1 || true)
          test -n "$APK"
          test -s "$APK"
          unzip -l "$APK" >/dev/null
          ls -la dist

      # 幂等：同一个 commit 重复跑（workflow_dispatch / 重跑）时先清掉旧的 tag 与 release。
      # 放在「产物校验通过之后」，避免构建失败却先把已有 Release 删掉。
      - name: Delete pre-existing tag & release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ needs.build.outputs.tag }}" --repo "${{ github.repository }}" --yes --cleanup-tag || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: BlockDirs v${{ needs.build.outputs.vc }} (${{ needs.build.outputs.vn }})
          files: dist/*.apk
          body: |
            阻止外置存储（OTG U 盘 / SD 卡）自动创建 Android、Music、Pictures、DCIM、Movies 等标准目录的 LSPosed 模块。

            ## 本次更新
            ${{ needs.build.outputs.msg }}

            ## 使用说明
            1. 手机需已 Root 并安装支持 libxposed 新 API 的 LSPosed；
            2. 下载下方 app-release.apk 安装；
            3. 在 LSPosed 勾选 BlockDirs（模块已内置作用域推荐）；
            4. 重启手机后生效。
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

  # ── 3) 可选：把已发布的产物同步到 LSPosed 官方模块仓库 ────────────────────
  # 默认跳过；配置好下面两项后才会执行，fork / 个人构建不会因此变红：
  #   仓库变量 MIRROR_REPO  = Xposed-Modules-Repo/top.yixiangren.blockdirs
  #   仓库密钥 MIRROR_TOKEN = 有该仓库写权限的 PAT
  publish-mirror:
    needs: [ build, release ]
    if: ${{ vars.MIRROR_REPO != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download APK from this repo's release
        run: |
          set -e
          TAG="${{ needs.build.outputs.tag }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/app-release.apk"
          echo "Downloading $URL"
          curl -fsSL -o app-release.apk "$URL"
          test -s app-release.apk
          # 必须是合法 zip，避免把 404 页面之类的东西当成 APK 传上去
          unzip -l app-release.apk >/dev/null
          ls -la app-release.apk

      - name: Publish release to LSPosed mirror repo
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -e
          REPO="${{ vars.MIRROR_REPO }}"
          TAG="${{ needs.build.outputs.tag }}"
          VER="BlockDirs v${{ needs.build.outputs.vn }}"
          MSG="${{ needs.build.outputs.msg }}"
          BODY="阻止外置存储（OTG U 盘 / SD 卡）自动创建 Android、Music、Pictures、DCIM、Movies 等标准目录的 LSPosed 模块。\n\n本次更新：\n${MSG}"
          API="https://api.github.com/repos/$REPO"

          # 1. 删除同 tag 的旧 release（若存在），避免重复
          for rid in $(curl -s -H "Authorization: token $TOKEN" "$API/releases" | jq -r --arg t "$TAG" '.[] | select(.tag_name==$t) | .id' 2>/dev/null); do
            echo "删除旧 release $rid (tag=$TAG)"
            curl -s -X DELETE -H "Authorization: token $TOKEN" "$API/releases/$rid" >/dev/null 2>&1 || true
          done

          # 2. 删除旧 tag ref（先查存在性，存在才删，消除 422 假失败）
          if curl -s -H "Authorization: token $TOKEN" "$API/git/refs/tags/$TAG" | jq -e '.ref' >/dev/null 2>&1; then
            echo "删除旧 tag $TAG"
            curl -s -X DELETE -H "Authorization: token $TOKEN" "$API/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          fi

          # 3. 取镜像仓库 main 分支 sha 作为 tag 指向
          MAIN_SHA=$(curl -s -H "Authorization: token $TOKEN" "$API/git/refs/heads/main" | jq -r '.object.sha')
          test -n "$MAIN_SHA" && test "$MAIN_SHA" != "null"

          # 4. 创建 release（带 target_commitish，让 GitHub 自动创建 lightweight tag，消除竞态）
          RESP=$(curl -s --fail -X POST -H "Authorization: token $TOKEN" \
            -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"$MAIN_SHA\",\"name\":\"$VER\",\"body\":\"$BODY\",\"draft\":false,\"prerelease\":false}" \
            "$API/releases")
          UPLOAD_URL=$(echo "$RESP" | jq -r '.upload_url')
          test -n "$UPLOAD_URL" && test "$UPLOAD_URL" != "null"

          # 5. 上传 APK
          UPLOAD_URL="${UPLOAD_URL%\{*}?name=app-release.apk"
          curl -s --fail -X POST -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@app-release.apk" "$UPLOAD_URL" >/dev/null

          # 6. 同步 README 到镜像仓库（让模块详情页显示完整介绍）
          if [ -f README.md ]; then
            README_B64=$(base64 -w0 README.md)
            # 查镜像仓库 README.md 当前 sha（存在则更新，否则创建）
            README_SHA=$(curl -s -H "Authorization: token $TOKEN" "$API/contents/README.md" | jq -r '.sha // empty')
            if [ -n "$README_SHA" ]; then
              echo "更新镜像 README.md (sha=$README_SHA)"
              curl -s --fail -X PUT -H "Authorization: token $TOKEN" \
                -d "{\"message\":\"docs: 同步 README\",\"content\":\"$README_B64\",\"sha\":\"$README_SHA\"}" \
                "$API/contents/README.md" >/dev/null
            else
              echo "创建镜像 README.md"
              curl -s --fail -X PUT -H "Authorization: token $TOKEN" \
                -d "{\"message\":\"docs: 初始化 README\",\"content\":\"$README_B64\"}" \
                "$API/contents/README.md" >/dev/null
            fi
          fi

          echo "mirror release published ($TAG), bot will publish in 5min"
